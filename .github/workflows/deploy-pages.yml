name: Build and deploy site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build static site
        working-directory: site
        run: bun run build

      # GitHub does not provide repository secrets to pull requests from forks.
      # Those pull requests still build successfully, but cannot be deployed.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy site/out --project-name=hero4hire
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
